<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>FrameGrab</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="bar">
  <button class="btn" id="openBtn" data-tip="Ctrl+O">
    <svg viewBox="0 0 16 16"><path d="M1.5 4.5v8a1 1 0 0 0 1 1h9.6a1 1 0 0 0 .96-.72l1.4-4.8a.75.75 0 0 0-.72-.98H5.1a1 1 0 0 0-.96.72L2.6 13"/><path d="M1.5 4.5v-1a1 1 0 0 1 1-1h3l1.5 1.5h4.5a1 1 0 0 1 1 1V7"/></svg>
    <span data-i18n="open">打开视频</span>
  </button>
  <div class="filename" id="fileName"></div>
  <div class="seg" id="formatSeg" role="radiogroup" aria-label="format">
    <button role="radio" data-fmt="png" aria-checked="true">PNG</button>
    <button role="radio" data-fmt="jpg" aria-checked="false">JPG</button>
  </div>
  <button class="btn" id="copyBtn" disabled data-tip="Ctrl+C">
    <svg viewBox="0 0 16 16"><rect x="5.5" y="5.5" width="8" height="9" rx="1.5"/><path d="M10.5 5.5V3a1.5 1.5 0 0 0-1.5-1.5H4A1.5 1.5 0 0 0 2.5 3v6A1.5 1.5 0 0 0 4 10.5h1.5"/></svg>
    <span data-i18n="copy">复制</span>
  </button>
  <button class="btn accent" id="saveBtn" disabled data-tip="Ctrl+S">
    <svg viewBox="0 0 16 16"><path d="M8 2v8.5M4.5 7.5 8 11l3.5-3.5M2.5 13.5h11"/></svg>
    <span data-i18n="save">保存当前帧</span>
  </button>
</header>

<main class="stage" id="stage">
  <video id="video" playsinline preload="auto"></video>
  <div class="empty" id="empty">
    <svg viewBox="0 0 48 48" class="empty-icon"><rect x="6" y="10" width="36" height="28" rx="4"/><path d="M20.5 18.5v11l9-5.500z"/></svg>
    <div class="empty-title" data-i18n="emptyTitle">将视频拖到此处</div>
    <div class="empty-sub" data-i18n="emptySub">或点击“打开视频”选择文件</div>
  </div>
  <div class="dropmask" id="dropMask"><span data-i18n="dropHere">松开以打开视频</span></div>
</main>

<footer class="deck">
  <div class="scrub">
    <input type="range" id="seek" min="0" max="1" step="0.001" value="0" disabled aria-label="timeline">
  </div>
  <div class="transport">
    <div class="tc">
      <input id="tcInput" class="tc-input" value="00:00:00.000" spellcheck="false" disabled aria-label="timecode">
      <span class="tc-dur" id="tcDur">/ 00:00:00.000</span>
    </div>
    <div class="keys">
      <button class="icon" id="prevBtn" disabled data-tip-key="tipPrev">
        <svg viewBox="0 0 16 16"><path d="M4 3v10"/><path class="fill" d="M12.5 3.200v9.600L6 8z"/></svg>
      </button>
      <button class="icon big" id="playBtn" disabled data-tip-key="tipPlay">
        <svg viewBox="0 0 16 16" id="icoPlay"><path class="fill" d="M4.500 2.500v11L13.500 8z"/></svg>
        <svg viewBox="0 0 16 16" id="icoPause" hidden><path class="fill" d="M4 2.500h2.500v11H4zM9.500 2.500H12v11H9.500z"/></svg>
      </button>
      <button class="icon" id="nextBtn" disabled data-tip-key="tipNext">
        <svg viewBox="0 0 16 16"><path d="M12 3v10"/><path class="fill" d="M3.500 3.200v9.600L10 8z"/></svg>
      </button>
    </div>
    <div class="meta" id="meta"></div>
  </div>
</footer>

<div class="toast" id="toast" role="status">
  <svg viewBox="0 0 16 16" class="toast-ico" id="toastIco"><circle cx="8" cy="8" r="6.5"/><path d="m5.200 8.200 2 2 3.600-4"/></svg>
  <span id="toastText"></span>
  <button class="link" id="toastAction" hidden></button>
</div>

<input type="file" id="filePicker" accept="video/*,.mkv,.mov,.avi,.ts,.m4v" hidden>
<script src="app.js"></script>
</body>
</html>
